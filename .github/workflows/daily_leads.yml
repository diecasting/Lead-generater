name: Daily Leads Collection

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0点（北京时间早8点）运行
  workflow_dispatch:      # 允许手动触发

jobs:
  collect-leads:
    runs-on: ubuntu-latest

    # 关键：在 job 级别定义全局环境变量，该 job 下所有 step 都能直接读取到 Secrets
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_RECIPIENT: ${{ secrets.MAIL_RECIPIENT }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      BING_API_KEY: ${{ secrets.BING_API_KEY }}
      MAIL_SENDER: ${{ secrets.MAIL_SENDER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 跨运行持久化「已推送线索」缓存，使去重机制在 GitHub Actions 中真正生效
      - name: Cache sent history (dedup across runs)
        uses: actions/cache@v4
        with:
          path: sent_cache.json
          key: sent-history-cache-v1

      - name: Run lead collector
        run: python main.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-report
          path: |
            leads_report.html
            leads_report.json
